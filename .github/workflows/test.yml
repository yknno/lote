name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lote
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lote"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lote
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: mise.toml
          version-type: strict
      - run: gleam deps download
      - run: gleam run -m cigogne -- all
      - run: gleam test
      - run: gleam format --check src test
